# PulseOwl Collector
# Lightweight workflow that sends selected dependency related files to PulseOwl
# for automated dependency tracking and maintenance analysis.
# More info and docs: https://pulseowl.dev
#
# Required while using PulseOwl.
# Safe to keep in the repository, it only runs on push events.
#
# Updates are managed from the PulseOwl app.
# Support: support@pulseowlhq.com
name: PulseOwl Collector

on:
  workflow_dispatch:
    inputs:
      pulseowl-env:
        description: "Advanced: PulseOwl backend environment. Leave empty unless instructed by support."
        required: false
        type: string
        default: ""

  push:
    branches:
      # This branch was prefilled with your repository's default branch.
      # Change it if you prefer to run PulseOwl on a different branch
      # (e.g., the branch where you prepare releases).
      - "{{DEFAULT_BRANCH}}"

permissions:
  contents: read
  id-token: write

jobs:
  pulseowl:
    uses: PulseOwl/pulseowl-github-actions/.github/workflows/collector.yml@8b731320879a693a6ac26ec9cfb7b3caeef7ea55
    with:
      caller-version: "1.0.0"
      reusable-workflow-pin: "8b731320879a693a6ac26ec9cfb7b3caeef7ea55"
      audience: "pulseowl"
      pulseowl-env: ${{ inputs.pulseowl-env || '' }}
