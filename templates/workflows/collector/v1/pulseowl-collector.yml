name: PulseOwl Collector

on:
  workflow_dispatch:
    inputs:
      pulseowl-env:
        description: "Advanced: PulseOwl backend environment. Leave empty unless instructed by support."
        required: false
        type: string
        default: ""
      config-path:
        description: "Optional path to PulseOwl config file. Defaults to .config/pulseowl/config.yml if blank."
        required: false
        type: string

  push:
    branches:
      # This branch was prefilled with your repository's default branch.
      # Change it if you prefer to run PulseOwl on a different branch
      # (e.g., the branch where you prepare releases).
      - "{{DEFAULT_BRANCH}}"

permissions:
  contents: read
  id-token: write

jobs:
  pulseowl:
    uses: PulseOwl/pulseowl-github-actions/.github/workflows/collector.yml@collector-v1
    with:
      caller-version: "1.0.0"
      audience: "pulseowl"
      pulseowl-env: ${{ inputs.pulseowl-env || '' }}
      # To use a custom config path, replace the '' below with your path
      # Example: ${{ inputs.config-path || 'my-custom-folder/config.yml' }}
      config-path: ${{ inputs.config-path || '' }}
