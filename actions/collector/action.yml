name: "PulseOwl Collector"
description: "Collects repository metadata and posts it to PulseOwl using GitHub OIDC."
inputs:
  pulseowl-env:
    description: "Optional env suffix (blank = prod)."
    required: false
    default: ""
  audience:
    description: "OIDC audience to request."
    required: false
    default: "pulseowl"
  caller-version:
    description: "Version of the collector caller workflow."
    required: false
    default: "unknown"
  reusable-workflow-pin:
    description: "Version pin of the reusable workflow."
    required: false
    default: "unknown"

runs:
  using: "node24"
  main: "dist/index.mjs"
