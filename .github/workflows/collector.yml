# Reusable Workflow for PulseOwl Collector Runner
name: PulseOwl Collector Runner

on:
  workflow_call:
    inputs:
      audience:
        required: false
        type: string
        default: "pulseowl"
      caller-version:
        required: false
        type: string
        default: "unknown"
      reusable-workflow-pin:
        required: false
        type: string
        default: "unknown"
      pulseowl-env:
        required: false
        type: string
        default: ""

jobs:
  collect:
    runs-on: ubuntu-slim
    timeout-minutes: 5

    concurrency:
      group: pulseowl-collector-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          lfs: false

      - name: Run PulseOwl collector
        uses: PulseOwl/pulseowl-github-actions/actions/collector@119f881f67903650a6ca223d58389a36e01735b9
        with:
          caller-version: ${{ inputs.caller-version }}
          reusable-workflow-pin: ${{ inputs.reusable-workflow-pin }}
          audience: ${{ inputs.audience }}
          pulseowl-env: ${{ inputs.pulseowl-env }}
